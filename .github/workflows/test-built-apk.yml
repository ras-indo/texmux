name: Test Built APK (Emulator)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build run id (leave empty to use latest successful build)'
        required: false
        type: string

jobs:
  test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK from build run
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: .github/workflows/android-ci.yml
          workflow_conclusion: success
          name: texmux-debug-apk
          run_id: ${{ github.event.inputs.run_id }}
          path: ./artifacts

      - name: Find APK
        run: |
          find artifacts -name "*.apk" | head -5
          APK=$(find artifacts -name "*.apk" | head -1)
          echo "APK=$APK" >> $GITHUB_ENV
          cp "$APK" ./app-release.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test APK on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb install -r app-release.apk
            adb shell pm list packages | grep -E "texmux|termux" || true
            adb logcat -c
            echo "--- Starting TermuxActivity ---"
            adb shell am start -n texmux.app/texmux.app.TermuxActivity || adb shell monkey -p texmux.app -c android.intent.category.LAUNCHER 1 || true
            sleep 20
            echo "--- Triggering termux-api ---"
            # Try broadcast to TermuxApiReceiver (app module)
            adb shell am broadcast -n texmux.app/texmux.api.TermuxApiReceiver -a com.termux.api.action.API --es api_method version 2>&1 | tail -10 || true
            adb shell am broadcast -n texmux.app/texmux.api.TermuxApiReceiver -a com.termux.api.intent.action.API --es method version 2>&1 | tail -10 || true
            # Try generic termux-api broadcast intents
            adb shell am broadcast -a com.termux.api.BROADCAST --es cmd termux-battery-status 2>&1 | tail -10 || true
            adb shell am broadcast -a com.termux.api.TERMUX_API --es cmd termux-battery-status 2>&1 | tail -10 || true
            # Try termux-am style
            adb shell am broadcast -a com.termux.broadcast.TERMUX_API --es cmd termux-battery-status 2>&1 | tail -10 || true
            # Try calling termux-api binary if present in app data or via shell
            adb shell "command -v termux-api 2>&1 | head -1; find /data/data/texmux.app -name termux-api 2>&1 | head -5; find /data/app -name termux-api 2>&1 | head -5" || true
            adb shell "su -c 'termux-api battery-status' 2>&1 | tail -5" || true
            adb shell "/data/data/texmux.app/files/usr/bin/termux-api battery-status 2>&1 | tail -5" || true
            adb shell "/data/data/texmux.app/files/usr/libexec/termux-api 2>&1 | tail -2" || true
            sleep 15
            echo "--- Capturing filtered logcat ---"
            adb logcat -d | grep -E "termux-api|TermuxAPI|termux_am|TermuxAm|am broadcast|TermuxApi|termux-am" | tail -150 || adb logcat -d | tail -80

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logs
          path: |
            *.log
