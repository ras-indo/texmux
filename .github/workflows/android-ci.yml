name: Android CI - Texmux

# Reverted to the recipe that is known to work on-device (the
# termux-app-backup tree): build the APK and ship the proot binary that is
# committed in app/src/main/assets/proot/proot.
#
# Do NOT add a step that rebuilds proot into that path. The committed binary
# is the Termux build that has the sysvipc extension and accepts the flags
# sandbox.sh passes (-L, --sysvipc); a rebuild from termux-proot/ produces a
# different, smaller binary without them, and every session then dies with
# "unknown option" or a silent 255.

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  # Stamped into the APK so a build can be identified on the device
  # (Settings > Apps > Termux, files/.apk_version, and the APK file name).
  TERMUX_APP_VERSION_NAME: 0.118.0-r${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Remove local aapt2 override (not valid on CI)
        run: sed -i '/^android.aapt2FromMavenOverride/d' gradle.properties

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;25.0.8775105" "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Record the shipped proot checksum
        run: |
          P=app/src/main/assets/proot/proot
          ls -l "$P"
          file "$P"
          file "$P" | grep -q 'ARM aarch64' || { echo "!! proot asset is not arm64"; exit 1; }
          md5sum "$P" | tee /tmp/proot.md5
          # The sysvipc extension is what makes the shipped sandbox.sh flags
          # (-L, --sysvipc) valid. A proot without it fails every session.
          strings "$P" | grep -q 'extension/sysvipc/sysvipc.c' \
            || { echo "!! this proot has no sysvipc extension"; exit 1; }
          echo "OK: shipping the committed proot (sysvipc present)"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK output
        run: |
          echo "=== APK files ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Verify the APK ships the same proot that was checked
        run: |
          APK=$(ls app/build/outputs/apk/debug/*_arm64-v8a.apk)
          unzip -p "$APK" assets/proot/proot > /tmp/apk-proot
          md5sum /tmp/apk-proot
          [ "$(md5sum /tmp/apk-proot | cut -d' ' -f1)" = "$(cut -d' ' -f1 /tmp/proot.md5)" ] \
            || { echo "!! APK proot differs from the committed one"; exit 1; }
          echo "OK: APK ships the committed proot"

      - name: Collect only the APK needed (arm64-v8a)
        run: |
          mkdir -p upload_apk
          cp app/build/outputs/apk/debug/*_arm64-v8a.apk upload_apk/
          APK=$(ls upload_apk/*.apk)
          echo "=== Collected for upload (~41MB, arm64-v8a only) ==="
          ls -lh "$APK"
          echo "APK_NAME: $(basename "$APK")"
          echo "APK_MD5: $(md5sum "$APK" | cut -d' ' -f1)"
          echo "versionName: $TERMUX_APP_VERSION_NAME"
          {
            echo "### Texmux build"
            echo "- APK: \`$(basename "$APK")\`"
            echo "- md5: \`$(md5sum "$APK" | cut -d' ' -f1)\`"
            echo "- versionName: \`$TERMUX_APP_VERSION_NAME\`"
            echo "- proot: committed asset, sysvipc present, md5 \`$(cut -d' ' -f1 /tmp/proot.md5)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: texmux-debug-apk
          path: upload_apk/*.apk
          if-no-files-found: error
