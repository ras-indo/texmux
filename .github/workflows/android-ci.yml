name: Android CI - Texmux

# Builds the APK and the proot binary it ships.
#
# proot is compiled from github.com/ras-indo/proot (the fork), and that fork is
# based on termux/proot so it has the two extensions this sandbox actually
# passes: --sysvipc (SysV IPC emulation - Android's app seccomp policy traps
# those syscalls) and -L (fix_symlink_size).  A fork without them builds fine
# but every launch dies with "unknown option", which is exactly how several
# rounds of device debugging were wasted.  The asserts below exist so that
# cannot happen silently again: the built binary must contain the sysvipc
# source marker and must list both flags.
#
# The binary that Termux itself ships is kept next to it as proot-legacy, and
# sandbox.sh falls back to it if the fresh build fails its 16 ms pre-flight.

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  # Stamped into the APK so a build can be identified on the device
  # (Settings > Apps > Termux and the APK file name).
  TERMUX_APP_VERSION_NAME: 0.118.0-r${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Remove local aapt2 override (not valid on CI)
        run: sed -i '/^android.aapt2FromMavenOverride/d' gradle.properties

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;25.0.8775105" "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build PRoot (arm64) from ras-indo/proot
        run: |
          make -C termux-proot install \
            NDK_DIR="$ANDROID_HOME/ndk/25.0.8775105" \
            API_LEVEL=24
          BIN=app/src/main/assets/proot/proot
          file "$BIN"
          ls -lh "$BIN"
          SIZE=$(stat -c%s "$BIN")

          file "$BIN" | grep -q 'ARM aarch64' \
            || { echo "!! proot is not arm64"; exit 1; }

          # feature parity with the binary the sandbox was written for
          strings "$BIN" | grep -q 'extension/sysvipc/sysvipc.c' \
            || { echo "!! proot has no sysvipc extension (--sysvipc would fail)"; exit 1; }
          strings "$BIN" | grep -qx -- '--sysvipc' \
            || { echo "!! proot does not accept --sysvipc"; exit 1; }
          strings -n 2 "$BIN" | grep -qx -- '-L' \
            || { echo "!! proot does not accept -L (fix_symlink_size)"; exit 1; }
          strings "$BIN" | grep -q 'PROOT_NO_PATH_CACHE' \
            || { echo "!! path cache not built in"; exit 1; }

          echo "proot size: $SIZE bytes"
          [ "$SIZE" -lt 1200000 ] || { echo "!! proot is unexpectedly large"; exit 1; }
          md5sum "$BIN" | tee /tmp/proot.md5
          echo "OK: proot built (sysvipc + -L + pcache present)"

      - name: Verify the fallback binary is still in place
        run: |
          L=app/src/main/assets/proot/proot-legacy
          ls -l "$L"
          file "$L" | grep -q 'ARM aarch64' || { echo "!! proot-legacy is not arm64"; exit 1; }
          strings "$L" | grep -q 'extension/sysvipc/sysvipc.c' \
            || { echo "!! proot-legacy lost its sysvipc extension"; exit 1; }
          md5sum "$L"
          echo "OK: fallback proot available"

      - name: Termux:API client protocol test (vs mock daemon)
        run: |
          set -euo pipefail
          mkdir -p /tmp/tapi-build
          gcc -O2 -Wall -DPREFIX='"/tmp/apitest"' \
            -o /tmp/tapi-build/termux-api \
            termux-api/native/termux-api-broadcast.c termux-api/native/termux-api.c
          file /tmp/tapi-build/termux-api
          python3 termux-api/native/test-protocol.py /tmp/tapi-build/termux-api

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK output
        run: |
          echo "=== APK files ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Verify the APK ships the proot that was just built
        run: |
          APK=$(ls app/build/outputs/apk/debug/*_arm64-v8a.apk)
          unzip -p "$APK" assets/proot/proot > /tmp/apk-proot
          unzip -p "$APK" assets/proot/proot-legacy > /tmp/apk-legacy
          md5sum /tmp/apk-proot /tmp/apk-legacy
          [ "$(md5sum /tmp/apk-proot | cut -d' ' -f1)" = "$(cut -d' ' -f1 /tmp/proot.md5)" ] \
            || { echo "!! APK proot differs from the freshly built one"; exit 1; }
          strings /tmp/apk-proot | grep -q 'extension/sysvipc/sysvipc.c' \
            || { echo "!! APK proot lost sysvipc"; exit 1; }
          echo "OK: APK ships the fresh proot + fallback"

      - name: Verify the APK ships a single, fixed termux-api client
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*_arm64-v8a.apk)
          unzip -p "$APK" assets/termux-api/bin/termux-api > /tmp/apk-termux-api
          file /tmp/apk-termux-api | grep -q 'ELF 64-bit' \
            || { echo "!! assets/termux-api/bin/termux-api is not an ELF binary"; exit 1; }
          strings /tmp/apk-termux-api | grep -q -- '--timeout' \
            || { echo "!! client lost the --timeout option (stale binary shipped?)"; exit 1; }
          strings /tmp/apk-termux-api | grep -q 'Exit status: 0 ok, 1 usage error' \
            || { echo "!! client lost its documented exit codes"; exit 1; }
          if unzip -l "$APK" | grep -qE 'assets/termux-api/(termux-api$|libexec/termux-api-broadcast)'; then
            echo "!! stale duplicate termux-api assets are still bundled"; exit 1
          fi
          size=$(stat -c%s /tmp/apk-termux-api)
          echo "termux-api client in APK: $size bytes, --timeout + exit codes present"
          echo "OK: one termux-api client, no stale duplicates"

      - name: Verify the wifi/bluetooth API additions are in the APK
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*_arm64-v8a.apk)
          rm -rf /tmp/apk-x && mkdir -p /tmp/apk-x
          unzip -oq "$APK" -d /tmp/apk-x 'classes*.dex' 'assets/termux-api/bin/termux-wifi' \
                     'assets/termux-api/bin/termux-bluetooth' 'assets/termux-api/bin/termux-permission'
          for token in hotspot-status hotspot-stop hotspot-enable hotspot-disable hotspot-clients \
                       system_channel rssi_percent le_supported ip_addresses \
                       gatt-rssi bonding_started unpair_started \
                       missing_privileged privapp-permissions; do
            grep -aq -- "$token" /tmp/apk-x/classes*.dex \
              || { echo "!! dex is missing the '$token' addition"; exit 1; }
          done
          # TETHER_PRIVILEGED lives in the binary manifest, not in the dex.
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | head -1)
          if [ -n "${AAPT:-}" ]; then
            "$AAPT" dump permissions "$APK" | grep -q TETHER_PRIVILEGED \
              || { echo "!! manifest lost TETHER_PRIVILEGED"; exit 1; }
          else
            unzip -p "$APK" AndroidManifest.xml | strings -a -el | grep -q TETHER_PRIVILEGED \
              || { echo "!! manifest lost TETHER_PRIVILEGED"; exit 1; }
          fi
          for opt in --band --min-rssi --dedupe; do
            grep -q -- "$opt" /tmp/apk-x/assets/termux-api/bin/termux-wifi \
              || { echo "!! termux-wifi is missing $opt"; exit 1; }
          done
          # Battery Service UUID proves the new GATT probe survived R8/D8 shrinking.
          grep -aq -- "00002a19-0000-1000-8000-00805f9b34fb" /tmp/apk-x/classes*.dex \
            || { echo "!! dex lost the Battery Level UUID"; exit 1; }
          for sub in "bond --address" "battery --address" "rssi --address"; do
            grep -qF -- "$sub" /tmp/apk-x/assets/termux-api/bin/termux-bluetooth \
              || { echo "!! termux-bluetooth is missing '$sub'"; exit 1; }
          done
          for sub in "status" "request" "--permissions"; do
            grep -q -- "$sub" /tmp/apk-x/assets/termux-api/bin/termux-permission \
              || { echo "!! termux-permission is missing '$sub'"; exit 1; }
          done
          # The prompt activity must be declared, otherwise the in-app prompt
          # never starts and the user only sees a bare error.
          if [ -n "${AAPT:-}" ]; then
            "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -q PermissionPromptActivity \
              || { echo "!! manifest does not declare PermissionPromptActivity"; exit 1; }
          else
            unzip -p "$APK" AndroidManifest.xml | strings -a -el | grep -q PermissionPromptActivity \
              || { echo "!! manifest does not declare PermissionPromptActivity"; exit 1; }
          fi
          echo "OK: hotspot, wifi scan filters, bluetooth bond/battery/rssi, in-app permission prompt present"

      - name: Collect only the APK needed (arm64-v8a)
        run: |
          mkdir -p upload_apk
          cp app/build/outputs/apk/debug/*_arm64-v8a.apk upload_apk/
          APK=$(ls upload_apk/*.apk)
          echo "=== Collected for upload (~41MB, arm64-v8a only) ==="
          ls -lh "$APK"
          echo "APK_NAME: $(basename "$APK")"
          echo "APK_MD5: $(md5sum "$APK" | cut -d' ' -f1)"
          echo "versionName: $TERMUX_APP_VERSION_NAME"
          {
            echo "### Texmux build"
            echo "- APK: \`$(basename "$APK")\`"
            echo "- md5: \`$(md5sum "$APK" | cut -d' ' -f1)\`"
            echo "- versionName: \`$TERMUX_APP_VERSION_NAME\`"
            echo "- proot: built from source, md5 \`$(cut -d' ' -f1 /tmp/proot.md5)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: texmux-debug-apk
          path: upload_apk/*.apk
          if-no-files-found: error

  # Regression gate for the PRoot fork that ships inside the APK.  It was
  # dropped when the vendored tree lacked the sysvipc extension; the fork is
  # built from ras-indo/proot now, so the upstream test suite can guard the
  # container behaviour again.
  proot-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build vendored talloc as a static library
        run: |
          set -euo pipefail
          V="$GITHUB_WORKSPACE/termux-proot/vendor/talloc"
          mkdir -p /tmp/talloc/lib /tmp/talloc/include /tmp/talloc/obj
          gcc -c -O2 -fPIC \
            -D_GNU_SOURCE=1 -D_XOPEN_SOURCE_EXTENDED=1 -D__STDC_WANT_LIB_EXT1__=1 \
            -DSTATIC_talloc_MODULES=NULL \
            '-DSTATIC_talloc_MODULES_PROTO=extern void __talloc_dummy_module_proto(void)' \
            -I"$V" -I"$V/lib/replace" \
            "$V/talloc.c" -o /tmp/talloc/obj/talloc.o
          ar rcs /tmp/talloc/lib/libtalloc.a /tmp/talloc/obj/talloc.o
          cp "$V/talloc.h" /tmp/talloc/include/
          echo 'prefix=/tmp/talloc' > /tmp/talloc/talloc.pc
          echo 'libdir=${prefix}/lib' >> /tmp/talloc/talloc.pc
          echo 'includedir=${prefix}/include' >> /tmp/talloc/talloc.pc
          echo 'Name: talloc' >> /tmp/talloc/talloc.pc
          echo 'Description: hierarchical pool based memory system' >> /tmp/talloc/talloc.pc
          echo 'Version: 2.4.2' >> /tmp/talloc/talloc.pc
          echo 'Libs: -L${libdir} -ltalloc' >> /tmp/talloc/talloc.pc
          echo 'Cflags: -I${includedir}' >> /tmp/talloc/talloc.pc
          PKG_CONFIG_PATH=/tmp/talloc pkg-config --exists talloc
          ls -lh /tmp/talloc/lib/libtalloc.a

      - name: Clone the optimized proot fork
        run: git clone --depth=1 --branch master https://github.com/ras-indo/proot.git /tmp/proot

      - name: Build proot (host) with the Android optimization flags
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH=/tmp/talloc
          make -C /tmp/proot/src -j"$(nproc)" WITHOUT_PYTHON=1 \
            CFLAGS="-O3 -DNDEBUG -ffunction-sections -fdata-sections -I/tmp/talloc/include -Wall -Wextra" \
            LDFLAGS="-Wl,--gc-sections -L/tmp/talloc/lib -ltalloc"
          file /tmp/proot/src/proot
          strings /tmp/proot/src/proot | grep -q 'PROOT_NO_PATH_CACHE' || { echo "!! pcache not built in"; exit 1; }
          echo "OK: pcache present in host build"

      - name: Smoke test the installer extraction path (-l + tar)
        run: |
          set -uo pipefail
          mkdir -p /tmp/smoke/src/tree/dir /tmp/smoke/dest /tmp/smoke/l2s /tmp/smoke/ptmp
          cp -a /usr/include /tmp/smoke/src/tree/include
          echo hello > /tmp/smoke/src/tree/dir/file
          ln /tmp/smoke/src/tree/dir/file /tmp/smoke/src/tree/dir/hardlink
          ln -s dir/file /tmp/smoke/src/tree/symlink
          mkfifo /tmp/smoke/src/tree/fifo
          # Real Ubuntu rootfs tarballs carry device nodes; an unprivileged
          # Android app cannot mknod them, which is what makes tar exit non-zero.
          sudo mknod /tmp/smoke/src/tree/devnode c 1 3 && echo "device node added"
          tar czf /tmp/smoke/rootfs.tgz -C /tmp/smoke/src tree
          echo "archive contains: $(tar tzf /tmp/smoke/rootfs.tgz | wc -l) entries"

          # Mirror the installer EXACTLY: proot -l (= --link2symlink), tar -xf,
          # PROOT_TMP_DIR + PROOT_L2S_DIR exported. tar's exit status is
          # EXPECTED to be non-zero here (unprivileged mknod) — the installer
          # tolerates it whenever the rootfs verifies, so this step must too.
          set +e
          PROOT_TMP_DIR=/tmp/smoke/ptmp PROOT_L2S_DIR=/tmp/smoke/l2s \
            /tmp/proot/src/proot -l /bin/tar -xf /tmp/smoke/rootfs.tgz -C /tmp/smoke/dest
          tar_rc=$?
          set -e
          echo "tar exit=$tar_rc (non-zero tolerated: unprivileged device node)"

          test -f /tmp/smoke/dest/tree/include/stdio.h || { echo "!! regular files missing"; exit 1; }
          test -f /tmp/smoke/dest/tree/dir/file || { echo "!! hardlinked payload missing"; exit 1; }
          readlink /tmp/smoke/dest/tree/symlink >/dev/null || { echo "!! symlink missing"; exit 1; }
          echo "extracted files: $(find /tmp/smoke/dest -type f | wc -l)"
          echo "OK: extraction usable despite tar exit=$tar_rc"

      - name: Run the upstream PRoot test suite
        run: |
          set -uo pipefail
          # The fork renamed test/ to tests/ when it was rebased on termux/proot.
          if [ -d /tmp/proot/tests ]; then
            cd /tmp/proot/tests
          else
            cd /tmp/proot/test
          fi

          # Bound every single proot invocation.  The upstream suite
          # contains a test that re-executes itself through
          # /proc/self/exe and never terminates on a current host; a
          # hang would otherwise block the whole suite until the job
          # times out.  A test that hits the limit reports 125, the
          # status the suite already uses for a test that cannot run
          # on this host, so a hang is neither reported as a failure
          # nor silently ignored.
          #
          # "timeout" is looked up with an absolute path: some tests
          # run proot with an empty PATH, where a bare "timeout" would
          # not be found.
          cat > /tmp/proot-timeout.sh <<'EOF'
          #!/bin/sh
          limit=${PROOT_TIMEOUT:-120}
          TIMEOUT_BIN=
          for candidate in /usr/bin/timeout /bin/timeout /usr/local/bin/timeout; do
              if [ -x "$candidate" ]; then
                  TIMEOUT_BIN=$candidate
                  break
              fi
          done
          if [ -z "$TIMEOUT_BIN" ]; then
              echo "proot-timeout: no timeout command found" >&2
              exit 125
          fi
          "$TIMEOUT_BIN" -k 5 "$limit" "$@"
          status=$?
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
              echo "proot-timeout: killed after ${limit}s" >&2
              exit 125
          fi
          exit "$status"
          EOF
          chmod +x /tmp/proot-timeout.sh

          # The suite must run serially: several tests share the same
          # rootfs and would interfere with each other when run in
          # parallel.
          make check PROOT="/tmp/proot-timeout.sh /tmp/proot/src/proot" 2>&1 | tee /tmp/check.log
          rc=${PIPESTATUS[0]}
          echo "make check exit=$rc"

          # Guard against a silently empty suite: "make check" in a
          # directory without any test file succeeds without running
          # anything, which once made this job report a green run that
          # actually tested nothing.
          checks=$(grep -c '^\s*CHECK\s' /tmp/check.log || true)
          echo "checks executed: $checks"
          if [ "${checks:-0}" -lt 50 ]; then
            echo "!! only ${checks:-0} checks ran -- the suite did not really execute"
            tail -40 /tmp/check.log
            exit 1
          fi

          if [ -s failure ]; then
            echo "=== failing checks ==="
            sed -n '1,120p' failure
          fi
          if [ "$rc" -ne 0 ]; then
            echo "=== last 80 log lines ==="
            tail -80 /tmp/check.log
            exit 1
          fi
          echo "OK: no test failures"
