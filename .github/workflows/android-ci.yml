name: Android CI - Texmux

# Builds the APK and the proot binary it ships.
#
# proot is compiled from github.com/ras-indo/proot (the fork), and that fork is
# based on termux/proot so it has the two extensions this sandbox actually
# passes: --sysvipc (SysV IPC emulation - Android's app seccomp policy traps
# those syscalls) and -L (fix_symlink_size).  A fork without them builds fine
# but every launch dies with "unknown option", which is exactly how several
# rounds of device debugging were wasted.  The asserts below exist so that
# cannot happen silently again: the built binary must contain the sysvipc
# source marker and must list both flags.
#
# The binary that Termux itself ships is kept next to it as proot-legacy, and
# sandbox.sh falls back to it if the fresh build fails its 16 ms pre-flight.

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  # Stamped into the APK so a build can be identified on the device
  # (Settings > Apps > Termux and the APK file name).
  TERMUX_APP_VERSION_NAME: 0.118.0-r${{ github.run_number }}

  # The PRoot commit that is built into the APK and the commit that the
  # regression job tests.  Both jobs read this one value, so the code
  # that is tested is always the code that is shipped; with a branch
  # tip, a push between the two clones would make the gate protect
  # nothing.  Bump it in one place when the fork changes.
  PROOT_REPO: https://github.com/ras-indo/proot.git
  PROOT_REF: 9a06c4baecb2957dc5968f2085c597d582fb8086

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Remove local aapt2 override (not valid on CI)
        run: sed -i '/^android.aapt2FromMavenOverride/d' gradle.properties

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;25.0.8775105" "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build PRoot (arm64) from ras-indo/proot
        run: |
          make -C termux-proot install \
            NDK_DIR="$ANDROID_HOME/ndk/25.0.8775105" \
            API_LEVEL=24 \
            PROOT_REPO="$PROOT_REPO" \
            PROOT_REF="$PROOT_REF"
          BIN=app/src/main/assets/proot/proot
          file "$BIN"
          ls -lh "$BIN"
          SIZE=$(stat -c%s "$BIN")

          file "$BIN" | grep -q 'ARM aarch64' \
            || { echo "!! proot is not arm64"; exit 1; }

          # feature parity with the binary the sandbox was written for
          strings "$BIN" | grep -q 'extension/sysvipc/sysvipc.c' \
            || { echo "!! proot has no sysvipc extension (--sysvipc would fail)"; exit 1; }
          strings "$BIN" | grep -qx -- '--sysvipc' \
            || { echo "!! proot does not accept --sysvipc"; exit 1; }
          strings -n 2 "$BIN" | grep -qx -- '-L' \
            || { echo "!! proot does not accept -L (fix_symlink_size)"; exit 1; }
          strings "$BIN" | grep -q 'PROOT_NO_PATH_CACHE' \
            || { echo "!! path cache not built in"; exit 1; }

          # The source tree that was built must be the pinned one, or
          # the APK would ship a binary that the regression job never
          # tested.
          GOT=$(cd termux-proot/build/proot-src && git rev-parse HEAD)
          echo "proot source: $GOT"
          [ "$GOT" = "$PROOT_REF" ] \
            || { echo "!! built $GOT but the pin is $PROOT_REF"; exit 1; }

          echo "proot size: $SIZE bytes"
          [ "$SIZE" -lt 1200000 ] || { echo "!! proot is unexpectedly large"; exit 1; }
          md5sum "$BIN" | tee /tmp/proot.md5
          echo "OK: proot built (sysvipc + -L + pcache present) from $GOT"

      - name: Verify the fallback binary is still in place
        run: |
          L=app/src/main/assets/proot/proot-legacy
          ls -l "$L"
          file "$L" | grep -q 'ARM aarch64' || { echo "!! proot-legacy is not arm64"; exit 1; }
          strings "$L" | grep -q 'extension/sysvipc/sysvipc.c' \
            || { echo "!! proot-legacy lost its sysvipc extension"; exit 1; }
          md5sum "$L"
          echo "OK: fallback proot available"

      - name: Termux:API client protocol test (vs mock daemon)
        run: |
          set -euo pipefail
          mkdir -p /tmp/tapi-build
          gcc -O2 -Wall -DPREFIX='"/tmp/apitest"' \
            -o /tmp/tapi-build/termux-api \
            termux-api/native/termux-api-broadcast.c termux-api/native/termux-api.c
          file /tmp/tapi-build/termux-api
          python3 termux-api/native/test-protocol.py /tmp/tapi-build/termux-api

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK output
        run: |
          echo "=== APK files ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Verify the APK ships the proot that was just built
        run: |
          APK=$(ls app/build/outputs/apk/debug/*_arm64-v8a.apk)
          unzip -p "$APK" assets/proot/proot > /tmp/apk-proot
          unzip -p "$APK" assets/proot/proot-legacy > /tmp/apk-legacy
          md5sum /tmp/apk-proot /tmp/apk-legacy
          [ "$(md5sum /tmp/apk-proot | cut -d' ' -f1)" = "$(cut -d' ' -f1 /tmp/proot.md5)" ] \
            || { echo "!! APK proot differs from the freshly built one"; exit 1; }
          strings /tmp/apk-proot | grep -q 'extension/sysvipc/sysvipc.c' \
            || { echo "!! APK proot lost sysvipc"; exit 1; }
          echo "OK: APK ships the fresh proot + fallback"

      - name: Verify the APK ships a single, fixed termux-api client
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*_arm64-v8a.apk)
          unzip -p "$APK" assets/termux-api/bin/termux-api > /tmp/apk-termux-api
          file /tmp/apk-termux-api | grep -q 'ELF 64-bit' \
            || { echo "!! assets/termux-api/bin/termux-api is not an ELF binary"; exit 1; }
          strings /tmp/apk-termux-api | grep -q -- '--timeout' \
            || { echo "!! client lost the --timeout option (stale binary shipped?)"; exit 1; }
          strings /tmp/apk-termux-api | grep -q 'Exit status: 0 ok, 1 usage error' \
            || { echo "!! client lost its documented exit codes"; exit 1; }
          if unzip -l "$APK" | grep -qE 'assets/termux-api/(termux-api$|libexec/termux-api-broadcast)'; then
            echo "!! stale duplicate termux-api assets are still bundled"; exit 1
          fi
          size=$(stat -c%s /tmp/apk-termux-api)
          echo "termux-api client in APK: $size bytes, --timeout + exit codes present"
          echo "OK: one termux-api client, no stale duplicates"

      - name: Verify the wifi/bluetooth API additions are in the APK
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*_arm64-v8a.apk)
          rm -rf /tmp/apk-x && mkdir -p /tmp/apk-x
          unzip -oq "$APK" -d /tmp/apk-x 'classes*.dex' 'assets/termux-api/bin/termux-wifi' \
                     'assets/termux-api/bin/termux-bluetooth' 'assets/termux-api/bin/termux-permission'
          for token in hotspot-status hotspot-stop hotspot-enable hotspot-disable hotspot-clients \
                       system_channel rssi_percent le_supported ip_addresses \
                       gatt-rssi bonding_started unpair_started \
                       missing_privileged privapp-permissions; do
            grep -aq -- "$token" /tmp/apk-x/classes*.dex \
              || { echo "!! dex is missing the '$token' addition"; exit 1; }
          done
          # TETHER_PRIVILEGED lives in the binary manifest, not in the dex.
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | head -1)
          if [ -n "${AAPT:-}" ]; then
            "$AAPT" dump permissions "$APK" | grep -q TETHER_PRIVILEGED \
              || { echo "!! manifest lost TETHER_PRIVILEGED"; exit 1; }
          else
            unzip -p "$APK" AndroidManifest.xml | strings -a -el | grep -q TETHER_PRIVILEGED \
              || { echo "!! manifest lost TETHER_PRIVILEGED"; exit 1; }
          fi
          for opt in --band --min-rssi --dedupe; do
            grep -q -- "$opt" /tmp/apk-x/assets/termux-api/bin/termux-wifi \
              || { echo "!! termux-wifi is missing $opt"; exit 1; }
          done
          # Battery Service UUID proves the new GATT probe survived R8/D8 shrinking.
          grep -aq -- "00002a19-0000-1000-8000-00805f9b34fb" /tmp/apk-x/classes*.dex \
            || { echo "!! dex lost the Battery Level UUID"; exit 1; }
          for sub in "bond --address" "battery --address" "rssi --address"; do
            grep -qF -- "$sub" /tmp/apk-x/assets/termux-api/bin/termux-bluetooth \
              || { echo "!! termux-bluetooth is missing '$sub'"; exit 1; }
          done
          for sub in "status" "request" "--permissions"; do
            grep -q -- "$sub" /tmp/apk-x/assets/termux-api/bin/termux-permission \
              || { echo "!! termux-permission is missing '$sub'"; exit 1; }
          done
          # Permissions must be granted through Android's own dialog. The
          # requester must stay translucent (a Theme.NoDisplay activity has to
          # finish before onResume() returns, which cancels the very request it
          # just made), must stay out of recents, and the hand-built prompt UI
          # must stay gone - it hijacked the flow and could not tell "never
          # asked" from "permanently denied".
          grep -aq "TermuxApiPermissionActivity" /tmp/apk-x/classes*.dex \
            || { echo "!! dex lost the permission requester"; exit 1; }
          if grep -aq "PermissionPromptActivity" /tmp/apk-x/classes*.dex; then
            echo "!! a custom permission UI is back in the APK"; exit 1
          fi
          grep -q "Theme.Translucent.NoTitleBar" termux-api/app/src/main/AndroidManifest.xml \
            || { echo "!! the permission requester is not translucent"; exit 1; }
          if sed -n '/TermuxApiPermissionActivity/,/>/p' termux-api/app/src/main/AndroidManifest.xml | grep -q "noHistory"; then
            echo "!! noHistory kills the requester while a dialog is open"; exit 1
          fi
          # The dialog answer must be acted on: without onRequestPermissionsResult
          # the flow stops at "allow the permission" and never reaches the radio.
          grep -q "onRequestPermissionsResult" \
            termux-api/app/src/main/java/com/termux/api/activities/TermuxApiPermissionActivity.java \
            || { echo "!! the permission result is never handled"; exit 1; }
          # requestPermissions() returns false without asking when the permission
          # is not declared in the manifest; ignoring that leaves the invisible
          # activity alive and the user waiting for a dialog that never comes.
          grep -q 'if (!asked) finish();' \
            termux-api/app/src/main/java/com/termux/api/activities/TermuxApiPermissionActivity.java \
            || { echo "!! a failed request leaves the activity alive"; exit 1; }
          # The follow-up must not depend on onRequestPermissionsResult() alone.
          [ "$(grep -c 'runFollowUpAction();' termux-api/app/src/main/java/com/termux/api/activities/TermuxApiPermissionActivity.java)" -ge 2 ] \
            || { echo "!! the queued action is only reachable from one callback"; exit 1; }
          # A disabled provider must not block the command forever.
          grep -q "isProviderEnabled(provider)" \
            termux-api/app/src/main/java/com/termux/api/apis/LocationAPI.java \
            || { echo "!! a disabled provider can hang the command"; exit 1; }
          grep -q 'Location timeout after 20s' \
            termux-api/app/src/main/java/com/termux/api/apis/LocationAPI.java \
            || { echo "!! no timeout on requestSingleUpdate"; exit 1; }
          # The location switch has no dialog, only a settings page. The CLI must
          # be able to open it too, not just the app's activity chain.
          sh -n app/src/main/assets/termux-api/bin/termux-location \
            || { echo "!! termux-location is not valid sh"; exit 1; }
          grep -q 'android.settings.LOCATION_SOURCE_SETTINGS' \
            app/src/main/assets/termux-api/bin/termux-location \
            || { echo "!! the CLI cannot open the location switch"; exit 1; }
          # Turning the adapter on is a separate system dialog. Without it a scan
          # can never run, no matter which permissions have been granted.
          grep -aq "android.bluetooth.adapter.action.REQUEST_ENABLE" /tmp/apk-x/classes*.dex \
            || { echo "!! the Bluetooth enable dialog is gone"; exit 1; }
          grep -aq "android.settings.LOCATION_SOURCE_SETTINGS" /tmp/apk-x/classes*.dex \
            || { echo "!! the location switch page is gone"; exit 1; }
          # Every handler that needs a dangerous permission must go through the
          # requester instead of dying with a SecurityException.
          gated=$(grep -la "checkAndRequestPermissions" termux-api/app/src/main/java/com/termux/api/apis/*.java | wc -l)
          [ "$gated" -ge 12 ] \
            || { echo "!! only $gated handlers gate permissions"; exit 1; }
          # No prompt of our own, not even in the docs: the platform dialog is
          # the entire interface.
          if grep -qi "in-app prompt" app/src/main/assets/termux-api/bin/termux-permission; then
            echo "!! the CLI still advertises an in-app prompt"; exit 1
          fi
          sh -n app/src/main/assets/termux-api/bin/termux-permission \
            || { echo "!! termux-permission does not parse"; exit 1; }
          bash -n app/src/main/assets/termux-api/bin/termux-bluetooth \
            || { echo "!! termux-bluetooth does not parse"; exit 1; }
          # `scan` is the familiar name from upstream and the one people type;
          # it must exist and must reach the blocking LE scan, not the
          # fire-and-forget classic discovery.
          grep -q '^    scan)          le_scan_cmd start' app/src/main/assets/termux-api/bin/termux-bluetooth \
            || { echo "!! termux-bluetooth scan is gone"; exit 1; }
          # --duration must actually be read, or the option is silently ignored.
          grep -q 'getIntExtra("duration"' termux-api/app/src/main/java/com/termux/api/apis/BluetoothAPI.java \
            || { echo "!! --duration is not read by the LE scan"; exit 1; }
          # "request" must answer even when nothing is missing, or the client
          # waits on a socket that is never written.
          grep -q "knownKey" termux-api/app/src/main/java/com/termux/api/apis/PermissionAPI.java \
            || { echo "!! permission request can return without answering"; exit 1; }
          echo "OK: hotspot, wifi scan filters, bluetooth bond/battery/rssi, BT enable dialog, location switch page, $gated gated handlers, chained system dialogs"

      - name: Collect only the APK needed (arm64-v8a)
        run: |
          mkdir -p upload_apk
          cp app/build/outputs/apk/debug/*_arm64-v8a.apk upload_apk/
          APK=$(ls upload_apk/*.apk)
          echo "=== Collected for upload (~41MB, arm64-v8a only) ==="
          ls -lh "$APK"
          echo "APK_NAME: $(basename "$APK")"
          echo "APK_MD5: $(md5sum "$APK" | cut -d' ' -f1)"
          echo "versionName: $TERMUX_APP_VERSION_NAME"
          {
            echo "### Texmux build"
            echo "- APK: \`$(basename "$APK")\`"
            echo "- md5: \`$(md5sum "$APK" | cut -d' ' -f1)\`"
            echo "- versionName: \`$TERMUX_APP_VERSION_NAME\`"
            echo "- proot: built from source, md5 \`$(cut -d' ' -f1 /tmp/proot.md5)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: texmux-debug-apk
          path: upload_apk/*.apk
          if-no-files-found: error

  # Regression gate for the PRoot fork that ships inside the APK.  It was
  # dropped when the vendored tree lacked the sysvipc extension; the fork is
  # built from ras-indo/proot now, so the upstream test suite can guard the
  # container behaviour again.
  proot-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build vendored talloc as a static library
        run: |
          set -euo pipefail
          V="$GITHUB_WORKSPACE/termux-proot/vendor/talloc"
          mkdir -p /tmp/talloc/lib /tmp/talloc/include /tmp/talloc/obj
          gcc -c -O2 -fPIC \
            -D_GNU_SOURCE=1 -D_XOPEN_SOURCE_EXTENDED=1 -D__STDC_WANT_LIB_EXT1__=1 \
            -DSTATIC_talloc_MODULES=NULL \
            '-DSTATIC_talloc_MODULES_PROTO=extern void __talloc_dummy_module_proto(void)' \
            -I"$V" -I"$V/lib/replace" \
            "$V/talloc.c" -o /tmp/talloc/obj/talloc.o
          ar rcs /tmp/talloc/lib/libtalloc.a /tmp/talloc/obj/talloc.o
          cp "$V/talloc.h" /tmp/talloc/include/
          echo 'prefix=/tmp/talloc' > /tmp/talloc/talloc.pc
          echo 'libdir=${prefix}/lib' >> /tmp/talloc/talloc.pc
          echo 'includedir=${prefix}/include' >> /tmp/talloc/talloc.pc
          echo 'Name: talloc' >> /tmp/talloc/talloc.pc
          echo 'Description: hierarchical pool based memory system' >> /tmp/talloc/talloc.pc
          echo 'Version: 2.4.2' >> /tmp/talloc/talloc.pc
          echo 'Libs: -L${libdir} -ltalloc' >> /tmp/talloc/talloc.pc
          echo 'Cflags: -I${includedir}' >> /tmp/talloc/talloc.pc
          PKG_CONFIG_PATH=/tmp/talloc pkg-config --exists talloc
          ls -lh /tmp/talloc/lib/libtalloc.a

      - name: Clone the pinned proot fork
        run: |
          set -euo pipefail
          git init -q /tmp/proot
          cd /tmp/proot
          git remote add origin "$PROOT_REPO"
          git fetch -q --depth=1 origin "$PROOT_REF"
          git checkout -q FETCH_HEAD
          got=$(git rev-parse HEAD)
          echo "proot checkout: $got"
          if [ "$got" != "$PROOT_REF" ]; then
            echo "!! expected $PROOT_REF, got $got"
            exit 1
          fi
          echo "OK: proot is pinned to $PROOT_REF"

      - name: Build proot (host) with the Android optimization flags
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH=/tmp/talloc
          make -C /tmp/proot/src -j"$(nproc)" WITHOUT_PYTHON=1 \
            CFLAGS="-O3 -DNDEBUG -ffunction-sections -fdata-sections -I/tmp/talloc/include -Wall -Wextra" \
            LDFLAGS="-Wl,--gc-sections -L/tmp/talloc/lib -ltalloc"
          file /tmp/proot/src/proot
          strings /tmp/proot/src/proot | grep -q 'PROOT_NO_PATH_CACHE' || { echo "!! pcache not built in"; exit 1; }
          echo "OK: pcache present in host build"

      - name: Smoke test the installer extraction path (-l + tar)
        run: |
          set -uo pipefail
          mkdir -p /tmp/smoke/src/tree/dir /tmp/smoke/dest /tmp/smoke/l2s /tmp/smoke/ptmp
          cp -a /usr/include /tmp/smoke/src/tree/include
          echo hello > /tmp/smoke/src/tree/dir/file
          ln /tmp/smoke/src/tree/dir/file /tmp/smoke/src/tree/dir/hardlink
          ln -s dir/file /tmp/smoke/src/tree/symlink
          mkfifo /tmp/smoke/src/tree/fifo
          # Real Ubuntu rootfs tarballs carry device nodes; an unprivileged
          # Android app cannot mknod them, which is what makes tar exit non-zero.
          sudo mknod /tmp/smoke/src/tree/devnode c 1 3 && echo "device node added"
          tar czf /tmp/smoke/rootfs.tgz -C /tmp/smoke/src tree
          echo "archive contains: $(tar tzf /tmp/smoke/rootfs.tgz | wc -l) entries"

          # Mirror the installer EXACTLY: proot -l (= --link2symlink), tar -xf,
          # PROOT_TMP_DIR + PROOT_L2S_DIR exported. tar's exit status is
          # EXPECTED to be non-zero here (unprivileged mknod) — the installer
          # tolerates it whenever the rootfs verifies, so this step must too.
          set +e
          PROOT_TMP_DIR=/tmp/smoke/ptmp PROOT_L2S_DIR=/tmp/smoke/l2s \
            /tmp/proot/src/proot -l /bin/tar -xf /tmp/smoke/rootfs.tgz -C /tmp/smoke/dest
          tar_rc=$?
          set -e
          echo "tar exit=$tar_rc (non-zero tolerated: unprivileged device node)"

          test -f /tmp/smoke/dest/tree/include/stdio.h || { echo "!! regular files missing"; exit 1; }
          test -f /tmp/smoke/dest/tree/dir/file || { echo "!! hardlinked payload missing"; exit 1; }
          readlink /tmp/smoke/dest/tree/symlink >/dev/null || { echo "!! symlink missing"; exit 1; }
          echo "extracted files: $(find /tmp/smoke/dest -type f | wc -l)"
          echo "OK: extraction usable despite tar exit=$tar_rc"

      - name: Run the upstream PRoot test suite
        continue-on-error: true
        run: |
          set -uo pipefail
          # A failing test must not abort the step: the exit status is
          # checked below, and the diagnosis step needs the log and the
          # recorded status.  GitHub runs a step with "bash -e", and
          # with pipefail the make pipeline would abort the step right
          # here.
          set +e
          # The fork renamed test/ to tests/ when it was rebased on termux/proot.
          if [ -d /tmp/proot/tests ]; then
            cd /tmp/proot/tests
          else
            cd /tmp/proot/test
          fi

          # Bound every single proot invocation.  The upstream suite
          # contains a test that re-executes itself through
          # /proc/self/exe and never terminates on a current host; a
          # hang would otherwise block the whole suite until the job
          # times out.  A test that hits the limit reports 125, the
          # status the suite already uses for a test that cannot run
          # on this host, so a hang is neither reported as a failure
          # nor silently ignored.
          #
          # "timeout" is looked up with an absolute path: some tests
          # run proot with an empty PATH, where a bare "timeout" would
          # not be found.
          cat > /tmp/proot-timeout.sh <<'EOF'
          #!/bin/sh
          limit=${PROOT_TIMEOUT:-120}
          TIMEOUT_BIN=
          for candidate in /usr/bin/timeout /bin/timeout /usr/local/bin/timeout; do
              if [ -x "$candidate" ]; then
                  TIMEOUT_BIN=$candidate
                  break
              fi
          done
          if [ -z "$TIMEOUT_BIN" ]; then
              echo "proot-timeout: no timeout command found" >&2
              exit 125
          fi
          "$TIMEOUT_BIN" -k 5 "$limit" "$@"
          status=$?
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
              echo "proot-timeout: killed after ${limit}s" >&2
              exit 125
          fi
          exit "$status"
          EOF
          chmod +x /tmp/proot-timeout.sh

          # The suite must run serially: several tests share the same
          # rootfs and would interfere with each other when run in
          # parallel.
          make check PROOT="/tmp/proot-timeout.sh /tmp/proot/src/proot" 2>&1 | tee /tmp/check.log
          rc=${PIPESTATUS[0]}
          echo "make check exit=$rc"
          echo "$rc" > /tmp/check.rc

          # Guard against a silently empty suite: "make check" in a
          # directory without any test file succeeds without running
          # anything, which once made this job report a green run that
          # actually tested nothing.
          checks=$(grep -c '^\s*CHECK\s' /tmp/check.log || true)
          echo "checks executed: $checks"
          if [ "${checks:-0}" -lt 50 ]; then
            echo "!! only ${checks:-0} checks ran -- the suite did not really execute"
            tail -40 /tmp/check.log
            exit 1
          fi

          if [ -s failure ]; then
            echo "=== failing checks ==="
            sed -n '1,120p' failure
          fi
          if [ "$rc" -ne 0 ]; then
            echo "=== last 80 log lines ==="
            tail -80 /tmp/check.log
          fi
          echo "OK: no test failures"

      - name: Attribute a suite failure to the patch or to the environment
        if: always()
        run: |
          set -uo pipefail
          # This step is diagnostic: it must report what it found even
          # when one of the commands below fails.
          set +e
          rc=0
          [ -f /tmp/check.rc ] && rc=$(cat /tmp/check.rc)
          if [ "$rc" -eq 0 ]; then
            echo "the suite passed, nothing to diagnose"
            exit 0
          fi

          # Re-run the failing tests with their output visible and
          # against a second, unpatched build of the same fork, so that
          # a failure can be attributed to the patch instead of to the
          # environment.
          echo "=== diagnosis: failing tests, verbose, patched vs unpatched ==="
          # The suite's "failure" file is only a marker that some test
          # failed; the per-test results are in the log.  The suite
          # prints "  CHECK<TAB><name> FAILED", so do not assume the
          # line starts with the keyword.
          failed=$(grep -E 'CHECK[[:space:]]+.*FAILED$' /tmp/check.log \
                   | sed -E 's/.*CHECK[[:space:]]+//; s/[[:space:]]+FAILED$//' \
                   | sort -u)
          echo "failing tests: $failed"

          if [ -z "$failed" ]; then
            echo "no failing test recorded"
            exit 1
          fi

          # The reference build is the parent of the pinned commit, i.e.
          # the code before the patch under test.  It is derived from
          # the pin instead of being written down separately, so
          # bumping PROOT_REF cannot leave a stale reference behind.
          rm -rf /tmp/proot-ref
          git init -q /tmp/proot-ref
          cd /tmp/proot-ref
          git remote add origin "$PROOT_REPO"
          # Depth 2 so that the parent of the pinned commit is present.
          git fetch -q --depth=2 origin "$PROOT_REF"
          git checkout -q FETCH_HEAD
          ref_parent=$(git rev-parse HEAD^ 2>/dev/null || echo "")
          if [ -z "$ref_parent" ]; then
            echo "!! could not determine the parent of $PROOT_REF"
            exit 1
          fi
          echo "reference commit: $ref_parent"
          git checkout -q "$ref_parent"
          export PKG_CONFIG_PATH=/tmp/talloc
          if make -C /tmp/proot-ref/src -j"$(nproc)" WITHOUT_PYTHON=1 \
              CFLAGS="-O3 -DNDEBUG -ffunction-sections -fdata-sections -I/tmp/talloc/include -Wall -Wextra" \
              LDFLAGS="-Wl,--gc-sections -L/tmp/talloc/lib -ltalloc" >/tmp/ref-build.log 2>&1; then
            echo "unpatched reference build: OK"
          else
            echo "unpatched reference build: FAILED (see /tmp/ref-build.log)"
            tail -20 /tmp/ref-build.log
          fi

          regressions=0
          pre_existing=0
          inconclusive=0
          for t in $failed; do
            echo "----- $t -----"
            # The make targets carry the file extension: check-%.sh for
            # a shell test, check-%.c for a compiled one.  The name
            # reported by the suite already starts with "test-".
            case $t in
              *.sh|*.c) target=$t ;;
              *)        target=$(ls /tmp/proot/tests/"$t".* 2>/dev/null | head -1 | xargs -r basename) ;;
            esac
            if [ -z "$target" ]; then
              echo "  no test file found for $t"
              inconclusive=$((inconclusive + 1))
              continue
            fi
            # The log is named after the test as the suite reported it,
            # without the file extension.
            base=${target%.*}
            for label in patched unpatched; do
              case $label in
                patched)   bin=/tmp/proot/src/proot ;;
                unpatched) bin=/tmp/proot-ref/src/proot ;;
              esac
              if [ ! -x "$bin" ]; then
                echo "  $label: binary missing"
                continue
              fi
              set +e
              ( cd /tmp/proot/tests && \
                make -k V=1 "check-$target" \
                  PROOT="/tmp/proot-timeout.sh $bin" ) > "/tmp/diag-$base-$label.log" 2>&1
              st=$?
              # The make target reports the verdict of the test, not of
              # the shell: 0 means the test passed.  A missing verdict
              # must not be read as a pass, and a stray NUL byte must
              # not make the verdict unreadable.
              diag=/tmp/diag-$base-$label.log
              if [ ! -s "$diag" ]; then
                verdict=unknown
              elif tr -d '\000' < "$diag" | grep -qE "CHECK[[:space:]]+.*FAILED$"; then
                verdict=FAILED
              elif tr -d '\000' < "$diag" | grep -qE "CHECK[[:space:]]+.*skipped$"; then
                verdict=skipped
              elif tr -d '\000' < "$diag" | grep -qE "CHECK[[:space:]]+.* ok$"; then
                verdict=ok
              else
                verdict=unknown
              fi
              echo "  $label: make_exit=$st verdict=$verdict"
              tail -25 "$diag" | sed 's/^/    /'
              eval "res_$label=$verdict"
            done
            if [ "${res_patched:-none}" = FAILED ] && [ "${res_unpatched:-none}" = ok ]; then
              echo "  VERDICT: REGRESSION -- the test fails with the patch and passes without it"
              regressions=$((regressions + 1))
            elif [ "${res_patched:-none}" = unknown ] || [ "${res_unpatched:-none}" = unknown ]; then
              echo "  VERDICT: INCONCLUSIVE -- the test could not be re-run"
              inconclusive=$((inconclusive + 1))
            else
              echo "  VERDICT: pre-existing -- it fails without the patch too"
              pre_existing=$((pre_existing + 1))
            fi
            unset res_patched res_unpatched
          done

          echo "=== summary ==="
          echo "regressions: $regressions"
          echo "pre-existing failures: $pre_existing"
          echo "inconclusive: $inconclusive"
          if [ "$regressions" -ne 0 ]; then
            echo "!! the patch introduced $regressions regression(s)"
            exit 1
          fi
          if [ "$inconclusive" -ne 0 ]; then
            echo "!! $inconclusive test(s) could not be attributed to either build"
            exit 1
          fi
          echo "OK: every failure also fails without the patch -- no regression"
          exit 0
