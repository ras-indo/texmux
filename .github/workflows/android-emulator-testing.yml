name: Android Emulator Tests

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - '**/*.java'
      - '**/*.kt'
      - '**/*.xml'
      - '**/build.gradle'
      - '**/build.gradle.kts'
      - '**/gradle.properties'
      - '**/gradle/**'
      - '.github/workflows/android-emulator-testing.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - '**/*.java'
      - '**/*.kt'
      - '**/*.xml'
      - '**/build.gradle'
      - '**/build.gradle.kts'
      - '**/gradle.properties'
      - '**/gradle/**'
      - '.github/workflows/android-emulator-testing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: termux-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Remove local aapt2 override (not valid on CI)
        run: sed -i '/^android.aapt2FromMavenOverride/d' gradle.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            termux-app/app/build/reports/tests/
            termux-app/app/build/test-results/
          if-no-files-found: ignore

  instrumented-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[test-instrumented]') || github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: termux-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Remove local aapt2 override (not valid on CI)
        run: sed -i '/^android.aapt2FromMavenOverride/d' gradle.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls /dev/kvm

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          disable-spellchecker: true
          emulator-boot-timeout: 600
          working-directory: termux-app
          script: ./gradlew connectedAndroidTest --no-daemon

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            termux-app/app/build/reports/androidTests/
            termux-app/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
